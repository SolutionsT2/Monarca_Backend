name: Monarca Tests

on: push

jobs:
  monarca_tests:
    name: Run tests (Jest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        ports:
          - 25000:5432
        env:
          POSTGRES_DB: Monarca
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test123
        options: >-
          --health-cmd="pg_isready -U postgres -d Monarca"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      mailhog:
        image: mailhog/mailhog:latest
        ports:
          - 1025:1025
          - 8025:8025

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 25000
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test123
      POSTGRES_DATABASE: Monarca
      TYPEORM_SYNCHRONIZE: true
      EMAIL_HOST: localhost
      EMAIL_PORT: 1025
      EMAIL_USER: ""
      EMAIL_PASSWORD: ""
      JWT_SECRET: test-secret-key
      FRONTEND_URL: http://localhost:3000
      DOWNLOAD_LINK: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - name: Verify monarca layout
        run: test -f monarca/package.json && test -d monarca/src

      - name: Install dependencies
        working-directory: ./monarca
        run: npm ci

      - name: Typecheck (no emit)
        working-directory: ./monarca
        run: npx tsc --noEmit

      - name: Wait for PostgreSQL to be ready
        run: |
          until pg_isready -h localhost -p 25000 -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
        shell: bash

      - name: Run all backend unit tests
        working-directory: ./monarca
        run: npm test -- --passWithNoTests
