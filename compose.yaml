
services:
  db: 
    build: ./DB
    # restart: always
    expose:
      - "5432"
    ports:
      - "25000:5432"
    environment:
      POSTGRES_PASSWORD: test123
      POSTGRES_DB: Monarca
      POSTGRES_USER: postgres
      #POSTGRES_HOST_AUTH_METHOD: trust
    container_name: monarca_database
    volumes:
      - ./DB/postgres:/var/lib/postgresql

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    container_name: monarca_mailhog